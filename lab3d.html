<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFD7A8">
<title>3D 곱셈 블록 실험실</title>
<style>
:root{
  --blue:#2F7BEA; --green:#14995A; --red:#E5484D; --sum:#7A3FD0;
  --ink:#2A2A3C; --brown:#8A4B12; --block:#FFD45C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;
  background:radial-gradient(circle at 80% 0%,#FFE9C9 0,#FFD7A8 45%,#F7B983 100%);
  font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation}
b,.b{color:var(--blue)} .g{color:var(--green)} .s{color:var(--sum)}

/* 위쪽 줄: 제목 · 문제 고르기 · 초당 화면 수 — 세 칸을 같은 너비로 나눠 가운데 칸이 정확히 가운데 */
#header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 28px 6px}
#title{font-size:24px;font-weight:800;white-space:nowrap}
#title small{display:block;font-size:15px;font-weight:700;color:#9A5B1E;margin-top:2px}
#probs{display:flex;gap:8px}
#probs button{height:46px;padding:0 18px;border-radius:23px;background:rgba(255,255,255,.55);font-size:20px;font-weight:800;color:#9A6A3A}
#probs button.on{background:#fff;color:var(--red);box-shadow:0 3px 0 rgba(150,80,20,.25)}
#fps{justify-self:end;font-size:14px;font-weight:700;color:#9A5B1E;background:rgba(255,255,255,.55);padding:6px 12px;border-radius:14px;white-space:nowrap}

/* 가운데: 3D 화면 */
#view{position:relative;flex:1;min-height:0;margin:6px 28px;border-radius:28px;overflow:hidden;
  background:linear-gradient(#BFE7FF,#E8F7FF 70%);box-shadow:0 6px 0 rgba(150,80,20,.18)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;
  font-weight:800;border-radius:16px;padding:4px 14px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);
  opacity:0;transition:opacity .35s}
.lb.show{opacity:1}
.lb.dim{font-size:18px;color:#7A5A3A;background:rgba(255,255,255,.85)}
.lb.big{font-size:28px;padding:6px 18px}
#reset{position:absolute;right:16px;top:16px;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.85);
  font-size:17px;font-weight:800;color:var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.12)}
#hint{position:absolute;left:16px;top:16px;height:44px;display:flex;align-items:center;padding:0 16px;border-radius:22px;
  background:rgba(255,255,255,.7);font-size:16px;font-weight:700;color:#5A6A7A}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:700;padding:40px;line-height:1.5}

/* 아래쪽 줄: 말풍선 · 버튼 — 세로 가운데 맞춤 */
#bottom{display:flex;align-items:center;gap:18px;padding:8px 28px 16px}
#parrot{font-size:64px;line-height:1;flex:none}
#bubble{position:relative;flex:1;min-height:104px;display:flex;align-items:center;background:#fff;border-radius:24px;
  padding:12px 26px;font-size:24px;line-height:1.4;font-weight:600;box-shadow:0 5px 0 rgba(150,80,20,.18)}
#bubble:before{content:"";position:absolute;left:-16px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:18px solid #fff;border-left:none}
#ctrls{display:flex;align-items:center;gap:12px;flex:none}
.cbtn{width:62px;height:62px;border-radius:50%;background:#fff;font-size:26px;color:var(--brown);box-shadow:0 4px 0 rgba(150,80,20,.25)}
.cbtn:disabled{opacity:.35}
#dots{display:flex;gap:8px}
#dots button{width:16px;height:16px;border-radius:50%;border:2px solid #C0782F;background:#fff;padding:0}
#dots button.done{background:#F2B06A}
#dots button.on{background:var(--red);border-color:var(--red);transform:scale(1.3)}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="header">
  <div id="title">🧊 3D 곱셈 블록 실험실<small>쪼개기 섬 원리를 입체 블록으로</small></div>
  <div id="probs"></div>
  <div id="fps">— fps</div>
</div>

<div id="view">
  <div id="labels"></div>
  <div id="hint">👆 한 손가락: 돌리기 · 두 손가락: 확대/이동</div>
  <button id="reset">🎯 처음 시점</button>
  <div id="err"></div>
</div>

<div id="bottom">
  <div id="parrot">🦜</div>
  <div id="bubble"></div>
  <div id="ctrls">
    <button class="cbtn" id="prev">⏮</button>
    <div id="dots"></div>
    <button class="cbtn" id="next">▶</button>
  </div>
</div>

<script>
// 3D 라이브러리를 못 불러올 때(인터넷 끊김 등) 빈 화면 대신 안내
window.addEventListener('error', e => {
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = '3D 화면을 불러오지 못했어요. 인터넷 연결을 확인해 주세요. (' + (e.message || '') + ')';
}, true);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 기준 숫자 (모든 위치는 이 숫자들에서 계산) ----------
const S = 1;          // 블록 한 칸 간격
const SIZE = 0.86;    // 블록 크기 (칸보다 조금 작게 → 한 개씩 셀 수 있게)
const GAP = 2.2;      // 쪼갰을 때 두 조각 사이 틈
const COLOR = {
  block: new THREE.Color('#FFD45C'),
  blue:  new THREE.Color('#2F7BEA'),
  green: new THREE.Color('#14995A'),
  sum:   new THREE.Color('#7A3FD0'),
};
const PROBLEMS = [[13, 12], [23, 14], [39, 27]];

// ---------- 장면 ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;   // 바닥 아래로는 못 내려가게
controls.minDistance = 8;
controls.maxDistance = 140;

scene.add(new THREE.HemisphereLight(0xffffff, 0xF2C79A, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// 모래 섬 바닥
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 0.6, 64),
  new THREE.MeshStandardMaterial({ color: 0xF6DDAF, roughness: 1 })
);
ground.position.y = -0.3 - SIZE / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- 블록 (같은 모양 수백 개를 한 번에 그리는 InstancedMesh) ----------
let mesh = null, N = 0, A = 0, B = 0, ONES = 0, TENS = 0;
let from, to, t0, dur, arc, ease, cFrom, cTo, cur, rowOf, colOf, waitHidden;
const geo = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
const mat = new THREE.MeshStandardMaterial({ roughness: 0.55 });
const m4 = new THREE.Matrix4();
const tmpC = new THREE.Color();
let animating = false;

function buildBlocks(a, b) {
  if (mesh) { scene.remove(mesh); mesh.dispose(); }
  A = a; B = b; ONES = b % 10; TENS = b - ONES; N = a * b;
  mesh = new THREE.InstancedMesh(geo, mat, N);
  mesh.castShadow = true; mesh.receiveShadow = true;
  from = new Float32Array(N * 3); to = new Float32Array(N * 3); cur = new Float32Array(N * 3);
  t0 = new Float64Array(N); dur = new Float32Array(N); arc = new Float32Array(N); ease = new Uint8Array(N); waitHidden = new Uint8Array(N);
  cFrom = new Float32Array(N * 3); cTo = new Float32Array(N * 3);
  rowOf = new Uint16Array(N); colOf = new Uint16Array(N);
  for (let r = 0, k = 0; r < b; r++) for (let i = 0; i < a; i++, k++) { rowOf[k] = r; colOf[k] = i; }
  for (let k = 0; k < N; k++) {
    cur[k * 3 + 1] = 999;
    m4.makeTranslation(0, 999, 0); mesh.setMatrixAt(k, m4);   // 처음엔 안 보이는 곳에
    mesh.setColorAt(k, COLOR.block);
  }
  scene.add(mesh);

  // 바닥·그림자 범위·카메라를 블록 크기에 맞춤
  const R = Math.hypot(a * S / 2, b * S / 2 + GAP);
  ground.scale.set(R + 1.5, 1, R + 1.5);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -(R + 2); sc.right = sc.top = R + 2; sc.near = 1; sc.far = R * 4 + 40;
  sc.updateProjectionMatrix();
  sun.position.set(R * 0.6, R * 1.6 + 10, R * 1.0);
  fitCamera();
}

// 행 r(0 = 맨 앞줄), 열 i 블록의 자리. 쪼개면 앞쪽 ONES줄(파랑)은 앞으로, 뒤쪽 TENS줄(초록)은 뒤로
function slot(r, i, split) {
  const x = (i - (A - 1) / 2) * S;
  let z = ((B - 1) / 2 - r) * S;
  if (split) z += r < ONES ? GAP / 2 : -GAP / 2;
  return [x, 0, z];
}
// 조각의 가운데 (라벨을 "무엇의 가운데"에 놓기 위한 계산)
function pieceCenter(which, split) {
  const rows = which === 'ones' ? [0, ONES - 1] : which === 'tens' ? [ONES, B - 1] : [0, B - 1];
  const z1 = slot(rows[0], 0, split)[2], z2 = slot(rows[1], 0, split)[2];
  return { z: (z1 + z2) / 2, front: Math.max(z1, z2), back: Math.min(z1, z2) };
}

// 블록 하나를 목표 자리·색으로 움직이기
function move(k, pos, color, { delay = 0, ms = 600, hop = 0, bounce = false, fromY = null } = {}) {
  const now = performance.now();
  for (let j = 0; j < 3; j++) {
    from[k * 3 + j] = cur[k * 3 + j];
    to[k * 3 + j] = pos[j];
  }
  waitHidden[k] = fromY !== null && cur[k * 3 + 1] > 500 ? 1 : 0;   // 떨어지기 전까지는 숨겨 두기
  if (fromY !== null) { from[k * 3] = pos[0]; from[k * 3 + 1] = fromY; from[k * 3 + 2] = pos[2]; }
  mesh.getColorAt(k, tmpC);
  cFrom[k * 3] = tmpC.r; cFrom[k * 3 + 1] = tmpC.g; cFrom[k * 3 + 2] = tmpC.b;
  cTo[k * 3] = color.r; cTo[k * 3 + 1] = color.g; cTo[k * 3 + 2] = color.b;
  t0[k] = now + delay; dur[k] = ms; arc[k] = hop; ease[k] = bounce ? 1 : 0;
  animating = true;
}
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function easeBounce(p) {
  const n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;
  if (p < 2 / d) return n * (p -= 1.5 / d) * p + .75;
  if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + .9375;
  return n * (p -= 2.625 / d) * p + .984375;
}
function tick(now) {
  if (!animating) return;
  let busy = false;
  for (let k = 0; k < N; k++) {
    let p = (now - t0[k]) / dur[k];
    if (p < 0) { busy = true; if (waitHidden[k]) continue; p = 0; }
    else if (p < 1) busy = true; else p = 1;
    const e = ease[k] ? easeBounce(p) : easeInOut(p);
    const h = arc[k] * Math.sin(Math.PI * p);
    for (let j = 0; j < 3; j++) cur[k * 3 + j] = from[k * 3 + j] + (to[k * 3 + j] - from[k * 3 + j]) * e;
    cur[k * 3 + 1] += h;
    m4.makeTranslation(cur[k * 3], cur[k * 3 + 1], cur[k * 3 + 2]);
    mesh.setMatrixAt(k, m4);
    tmpC.setRGB(
      cFrom[k * 3] + (cTo[k * 3] - cFrom[k * 3]) * p,
      cFrom[k * 3 + 1] + (cTo[k * 3 + 1] - cFrom[k * 3 + 1]) * p,
      cFrom[k * 3 + 2] + (cTo[k * 3 + 2] - cFrom[k * 3 + 2]) * p);
    mesh.setColorAt(k, tmpC);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  animating = busy;
}

// ---------- 라벨 (3D 자리를 화면 좌표로 바꿔 HTML 글상자를 그 가운데에) ----------
const labelBox = document.getElementById('labels');
let labels = [];
function setLabels(list, delay) {
  labels.forEach(l => l.el.remove());
  labels = list.map(({ html, pos, cls }) => {
    const el = document.createElement('div');
    el.className = 'lb ' + (cls || 'dim');
    el.innerHTML = html;
    labelBox.appendChild(el);
    return { el, pos: new THREE.Vector3(...pos) };
  });
  const mine = labels;
  setTimeout(() => mine.forEach(l => l.el.classList.add('show')), delay);
}
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = view.clientWidth, h = view.clientHeight;
  for (const l of labels) {
    v3.copy(l.pos).project(camera);
    const hidden = v3.z > 1;
    l.el.style.visibility = hidden ? 'hidden' : 'visible';
    l.el.style.left = ((v3.x + 1) / 2 * w) + 'px';
    l.el.style.top = ((1 - v3.y) / 2 * h) + 'px';
  }
}

// ---------- 단계 ----------
const T = n => `<span class="g">${n}</span>`, O = n => `<b>${n}</b>`;
const STEPS = [
  {
    say: () => `블록을 한 줄에 ${A}개씩, ${B}줄 놓았어요.<br>모두 몇 개일까요?`,
    run: (first) => {
      for (let k = 0; k < N; k++) {
        const r = rowOf[k], i = colOf[k];
        if (first) move(k, slot(r, i, false), COLOR.block, { fromY: 14, delay: r * 110 + i * 10, ms: 650, bounce: true });
        else move(k, slot(r, i, false), COLOR.block, { ms: 700 });
      }
      const c = pieceCenter('all', false);
      return { wait: first ? B * 110 + A * 10 + 500 : 700, labels: [
        { html: `한 줄에 ${A}개`, pos: [0, 0, c.back - 2] },
        { html: `${B}줄`, pos: [slot(0, 0)[0] - 2.4, 0.2, c.z] },
      ] };
    },
  },
  {
    say: () => `${B}줄을 ${T(TENS + '줄')}과 ${O(ONES + '줄')}로 쪼개 볼까요?<br>✂️ 싹둑!`,
    run: () => {
      for (let k = 0; k < N; k++) {
        const r = rowOf[k];
        move(k, slot(r, colOf[k], true), r < ONES ? COLOR.blue : COLOR.green, { ms: 800, delay: colOf[k] * 12 });
      }
      const o = pieceCenter('ones', true), t = pieceCenter('tens', true);
      const left = slot(0, 0)[0] - 2.4;
      return { wait: 800 + A * 12, labels: [
        { html: `한 줄에 ${A}개`, pos: [0, 0, t.back - 2] },
        { html: T(TENS + '줄'), pos: [left, 0.2, t.z] },
        { html: O(ONES + '줄'), pos: [left, 0.2, o.z] },
      ] };
    },
  },
  {
    say: () => `${O('파란 조각')}은 ${A}개씩 ${ONES}줄이에요.<br>${A} × ${ONES} = ${O(A * ONES)}`,
    run: () => blueGreen('ones'),
  },
  {
    say: () => `${T('초록 조각')}은 ${A}개씩 ${TENS}줄이에요.<br>${A} × ${TENS} = ${T(A * TENS)}`,
    run: () => blueGreen('tens'),
  },
  {
    say: () => `두 조각을 합치면<br>${O(A * ONES)} + ${T(A * TENS)} = <span class="s">${A * B}</span>개! 🎉`,
    run: () => {
      for (let k = 0; k < N; k++) move(k, slot(rowOf[k], colOf[k], false), COLOR.sum, { ms: 900, delay: rowOf[k] * 25 });
      const c = pieceCenter('all', false);
      return { wait: 900 + B * 25, labels: [
        { html: `<span class="s">${A} × ${B} = ${A * B}</span>`, pos: [0, 2.6, c.z], cls: 'big' },
      ] };
    },
  },
];
// 파랑/초록 조각 중 하나만 "통통" 뛰며 세어 보기 (한 번에 하나만 움직임)
function blueGreen(which) {
  for (let k = 0; k < N; k++) {
    const r = rowOf[k], isOnes = r < ONES;
    const color = isOnes ? COLOR.blue : COLOR.green;
    const jump = (which === 'ones') === isOnes;
    move(k, slot(r, colOf[k], true), color, jump ? { ms: 700, hop: 1.6, delay: colOf[k] * 30 } : { ms: 300 });
  }
  const o = pieceCenter('ones', true), t = pieceCenter('tens', true);
  const lab = [
    { html: O(`${A} × ${ONES} = ${A * ONES}`), pos: [0, 1.4, o.z], cls: 'big' },
  ];
  if (which === 'tens') lab.push({ html: T(`${A} × ${TENS} = ${A * TENS}`), pos: [0, 1.4, t.z], cls: 'big' });
  return { wait: 700 + A * 30, labels: lab };
}

// ---------- 진행 ----------
let step = 0, prob = 1, drawn = -1;
const bubble = document.getElementById('bubble');
const dots = document.getElementById('dots');
STEPS.forEach((_, i) => {
  const b = document.createElement('button');
  b.onclick = () => go(i);
  dots.appendChild(b);
});
function go(n) {
  step = Math.max(0, Math.min(STEPS.length - 1, n));
  const res = STEPS[step].run(drawn < 0);
  drawn = step;
  setLabels(res.labels, res.wait);
  bubble.innerHTML = '<div>' + STEPS[step].say() + '</div>';   // 한 덩어리로 감싸야 색 글자가 따로 줄바꿈되지 않음
  [...dots.children].forEach((d, i) => { d.className = i === step ? 'on' : i < step ? 'done' : ''; });
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').disabled = step === STEPS.length - 1;
}
function pick(p) {
  prob = p; drawn = -1;
  const [a, b] = PROBLEMS[p];
  buildBlocks(a, b);
  [...document.getElementById('probs').children].forEach((el, i) => el.classList.toggle('on', i === p));
  go(0);
}
PROBLEMS.forEach(([a, b], i) => {
  const el = document.createElement('button');
  el.textContent = `${a} × ${b}`;
  el.onclick = () => pick(i);
  document.getElementById('probs').appendChild(el);
});
document.getElementById('prev').onclick = () => go(step - 1);
document.getElementById('next').onclick = () => go(step + 1);
document.getElementById('reset').onclick = fitCamera;

// ---------- 카메라·화면 크기 ----------
function fitCamera() {
  const R = Math.hypot(A * S / 2 + 2.5, B * S / 2 + GAP + 1.5);
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const d = R / Math.sin(Math.min(vf, hf) / 2) * 0.78;
  const dir = new THREE.Vector3(0, 1.15, 1).normalize();
  camera.position.copy(dir.multiplyScalar(d));
  controls.target.set(0, 0, 0);
  controls.update();
}
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (N) fitCamera();
}
new ResizeObserver(resize).observe(view);

// ---------- 그리기 반복 + 초당 화면 수 ----------
const fpsEl = document.getElementById('fps');
let frames = 0, last = performance.now();
renderer.setAnimationLoop(now => {
  tick(now);
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
  frames++;
  if (now - last > 1000) {
    fpsEl.textContent = `${Math.round(frames * 1000 / (now - last))} fps · 블록 ${N}개`;
    frames = 0; last = now;
  }
});

resize();
pick(1);
window.lab = { go, pick, get step() { return step; } };   // 점검용
</script>
</body>
</html>
