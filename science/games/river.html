<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1814">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<title>꼬마 강 연구소</title>

<link rel="stylesheet" href="../font/fonts.css">
<style>
/* 레이아웃: 화면 전체가 디오라마, 그 위에 '실험 노트' 종이 패널이 가장자리에 붙는다 */
:root {
  --ink: #1c2626;          /* 먹색 */
  --ink-soft: #4a5654;
  --paper: rgba(236, 238, 232, 0.9);   /* 회녹색 실험 노트 종이 */
  --paper-solid: #e8ebe4;
  --rule: rgba(28, 38, 38, 0.14);
  --river: #1f6a72;        /* 강물 청록 */
  --river-deep: #134a51;
  --silt: #a5793c;         /* 흙빛 황토 — 별, 강조 */
  --brick: #a5492f;        /* 경고 */
  --leaf: #4c6b35;
  --f-display: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: max(14px, env(safe-area-inset-top, 0px));
  --bot: max(14px, env(safe-area-inset-bottom, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #2b2722; color: var(--ink); font-family: var(--f-ui); -webkit-font-smoothing: antialiased; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 500; }

/* 종이 패널 공통 */
.goal, .tools, .actions .act, .chip, .sampler, .hintbox, .toast, .title-card, .sheet, .ctlgroup {
  background: var(--paper);
  -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
  box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px -14px rgba(0,0,0,0.55);
}

/* ───── HUD ───── */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.goal { position: absolute; left: var(--gut); top: var(--top); width: min(360px, calc(100vw - 200px)); padding: 14px 16px 12px; border-radius: 4px 14px 14px 4px; border-left: 4px solid var(--river); }
.goal h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 2px 0 6px; letter-spacing: -0.01em; text-wrap: balance; }
.goal p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: var(--ink); }
.goal { cursor: pointer; }
.goal.compact #hudGoal, .goal.compact .eyebrow { display: none; }
.meter { height: 8px; border-radius: 4px; background: rgba(28,38,38,0.12); overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--river-deep), var(--river) 70%, #5ea7a6); transition: width .25s; }
.meter-fill.bad { background: linear-gradient(90deg, #7a2e1d, var(--brick)); }
.meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-top: 5px; gap: 8px; }
.budgets { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
.budgets b { color: var(--ink); font-weight: 600; }

.topright { position: absolute; right: var(--gutR); top: var(--top); display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
.ctlgroup { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; }
.ctlgroup:empty { display: none; }
.ctlgroup .lab { font-size: 12px; color: var(--ink-soft); padding: 0 6px 0 8px; }
.ctlgroup .chip { box-shadow: none; background: transparent; }
.chip { min-width: 48px; min-height: 48px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.chip.on { background: var(--ink) !important; color: #eef0ea; }
.chip.icon { width: 48px; padding: 0; }

.tools { position: absolute; right: var(--gutR); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 16px; }
.tool { width: 72px; min-height: 64px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; position: relative; }
.tool .ic { width: 28px; height: 28px; }
.tool:hover { background: rgba(28,38,38,0.07); }
.tool.on { background: var(--ink); color: #f0f2ec; }
.tool .bar { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 3px; border-radius: 2px; background: rgba(127,127,127,0.25); overflow: hidden; }
.tool .bar i { display: block; height: 100%; background: var(--river); }
.tool.on .bar i { background: #8fd0cf; }
.tool .key { position: absolute; top: 4px; right: 6px; font-size: 10px; opacity: 0.5; }

.actions { position: absolute; left: var(--gut); bottom: var(--bot); display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100vw - 260px); }
.act { min-height: 48px; padding: 0 14px 0 10px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.act .ic { width: 22px; height: 22px; }
.act:disabled { opacity: 0.45; }

.center-actions { position: absolute; right: var(--gutR); bottom: var(--bot); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.big { min-height: 56px; padding: 0 26px; border-radius: 28px; background: var(--river-deep); color: #eef6f4; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.6); }
.big:disabled { background: #56605e; }
.big.ice { background: #2f5d7a; }
.big .ic { width: 22px; height: 22px; }

.sampler { position: absolute; right: calc(var(--gutR) + 96px); bottom: calc(var(--bot) + 66px); width: 250px; padding: 10px 12px; border-radius: 12px; font-size: 12px; }
.sampler-head { font-weight: 600; margin-bottom: 6px; }
.srow { display: grid; grid-template-columns: 68px 1fr; align-items: center; gap: 8px; margin: 4px 0; }
.sbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: rgba(0,0,0,0.08); }
.sbar i, .lg { display: block; height: 100%; }
.g { background: #8d8a85; } .s { background: #d1b07c; } .m { background: #7b5a3c; }
.legend { display: flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--ink-soft); }
.lg { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.hintbox { position: absolute; left: var(--gut); top: calc(var(--top) + 220px); width: min(360px, calc(100vw - 200px)); padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; border-left: 4px solid var(--silt); }
.hintbox b { font-family: var(--f-display); }
.toast { position: absolute; left: 50%; top: calc(var(--top) + 6px); transform: translateX(-50%); padding: 10px 16px; border-radius: 22px; font-size: 14px; font-weight: 500; max-width: 80vw; text-align: center; }

#labels { position: fixed; inset: 0; pointer-events: none; }
.zlabel { position: absolute; transform: translate(-50%, -100%); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 10px; background: rgba(20,28,28,0.62); color: #f3f1ea; white-space: nowrap; letter-spacing: 0.02em; }
.zlabel.zl-goal { background: rgba(19,74,81,0.8); }
.zlabel.zl-protect { background: rgba(130,82,20,0.82); }

.ic { display: inline-block; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }

/* ───── 첫 화면 ───── */
.screen { position: fixed; inset: 0; }
#title { display: flex; align-items: flex-end; padding: 0 var(--gutR) calc(var(--bot) + 10px) var(--gut); background: linear-gradient(180deg, rgba(20,22,20,0) 40%, rgba(20,22,20,0.45)); }
.title-card { max-width: 560px; padding: 24px 26px 20px; border-radius: 6px 22px 22px 6px; border-left: 5px solid var(--river); }
.brand { font-family: var(--f-display); font-size: clamp(36px, 6vw, 58px); line-height: 1.05; margin: 6px 0 12px; letter-spacing: -0.02em; font-weight: 700; }
.lede { font-size: 16px; line-height: 1.65; margin: 0 0 18px; max-width: 46ch; }
.title-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.primary { min-height: 52px; padding: 0 24px; border-radius: 26px; background: var(--ink); color: #f1f3ec; font-weight: 600; font-size: 16px; }
.ghost { min-height: 48px; padding: 0 18px; border-radius: 24px; border: 1.5px solid rgba(28,38,38,0.35); font-weight: 500; background: rgba(255,255,255,0.35); }
.fineprint { margin: 14px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.6; }

/* ───── 실험 목록 ───── */
#map { background: linear-gradient(180deg, rgba(30,34,32,0.55), rgba(30,34,32,0.82)); overflow-y: auto; padding: var(--top) var(--gutR) var(--bot) var(--gut); touch-action: pan-y; }
.map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; color: #eef0ea; max-width: 1200px; margin: 0 auto 18px; }
.map-head .eyebrow { color: #b9c2bd; }
.map-head h1 { font-family: var(--f-display); font-size: 34px; margin: 4px 0 0; }
.map-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.map-tools .ghost { color: #eef0ea; border-color: rgba(238,240,234,0.4); background: rgba(255,255,255,0.06); }
.starcount { color: #e8c98a; font-weight: 600; margin-right: 6px; }
.map-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; max-width: 1200px; margin: 0 auto; }
.mgroup { background: var(--paper-solid); border-radius: 6px 16px 16px 6px; padding: 14px; border-left: 4px solid var(--river); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mgroup h2 { font-family: var(--f-display); font-size: 19px; margin: 0; }
.mgroup .sub { font-size: 12px; color: var(--ink-soft); margin: -4px 0 4px; }
.mstage { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; text-align: left; min-height: 56px; padding: 6px 10px 6px 6px; border-radius: 10px; background: rgba(255,255,255,0.55); border: 1px solid var(--rule); }
.mstage:hover:not(:disabled) { background: #fff; }
.mstage:disabled { opacity: 0.45; cursor: default; }
.mstage .no { font-family: var(--f-display); font-size: 15px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(28,38,38,0.08); }
.mstage.done .no { background: var(--river); color: #fff; }
.mstage .nm { font-weight: 500; font-size: 14px; line-height: 1.3; }
.stars { color: var(--silt); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.stars .off { color: rgba(28,38,38,0.2); }

/* ───── 모달 ───── */
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(18,22,20,0.42); padding: var(--top) var(--gutR) var(--bot) var(--gut); z-index: 10; touch-action: pan-y; }
.sheet { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; border-radius: 6px 20px 20px 6px; padding: 22px 24px; border-left: 5px solid var(--river); background: rgba(236,238,232,0.97); }
.sheet.wide { width: min(980px, 100%); }
.sheet h2 { font-family: var(--f-display); font-size: 26px; margin: 4px 0 10px; text-wrap: balance; }
.sheet h3 { font-family: var(--f-display); font-size: 18px; margin: 14px 0 6px; }
.sheet p { line-height: 1.7; margin: 0 0 12px; font-size: 15px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 16px; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.opt { min-height: 52px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--rule); background: rgba(255,255,255,0.7); font-size: 15px; line-height: 1.4; display: flex; gap: 10px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--river); }
.opt .mk { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; background: rgba(28,38,38,0.08); font-family: var(--f-display); }
.opt.right { border-color: var(--river); background: #dcebe8; }
.opt.right .mk { background: var(--river); color: #fff; }
.opt.wrong { border-color: var(--brick); background: #f1e1da; }
.explain { padding: 12px 14px; border-radius: 10px; background: rgba(31,106,114,0.09); font-size: 14px; line-height: 1.65; margin-top: 8px; }
.explain.bad { background: rgba(165,73,47,0.09); }
.goalbox { padding: 12px 14px; border-radius: 10px; border: 1px dashed rgba(28,38,38,0.35); font-size: 14px; line-height: 1.6; }
.starrow { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.starline { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px; font-size: 15px; }
.starline .st { font-size: 28px; color: rgba(28,38,38,0.18); transition: color .3s, transform .3s; }
.starline.got .st { color: var(--silt); transform: scale(1.1); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
.card { padding: 14px; border-radius: 12px; background: #fff; border: 1px solid var(--rule); min-width: 0; }
.card .kind { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-soft); }
.card h4 { font-family: var(--f-display); font-size: 17px; margin: 4px 0 6px; }
.card p { font-size: 14px; line-height: 1.65; margin: 0; }
.card.principle { border-top: 4px solid var(--river); }
.card.life { border-top: 4px solid var(--silt); }
.card.locked { background: rgba(255,255,255,0.4); color: var(--ink-soft); }
.notegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.notegroup { margin-bottom: 14px; }
table.rec { width: 100%; border-collapse: collapse; font-size: 13px; }
table.rec th, table.rec td { padding: 7px 8px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
table.rec th { font-weight: 600; color: var(--ink-soft); font-size: 12px; }
.tablewrap { overflow-x: auto; }
.math { display: flex; gap: 8px; align-items: center; font-size: 22px; font-family: var(--f-display); flex-wrap: wrap; }
.math input { width: 110px; min-height: 52px; font-size: 22px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--rule); font-family: var(--f-ui); }
.err { color: var(--brick); font-size: 14px; min-height: 20px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 24px; font-weight: 600; font-size: 15px; background: var(--ink); color: #f1f3ec; }
.btn.alt { background: transparent; color: var(--ink); border: 1.5px solid rgba(28,38,38,0.35); }
.btn.warn { background: var(--brick); }
.rotate { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(20,24,22,0.8); color: #eee; padding: 8px 14px; border-radius: 16px; font-size: 13px; z-index: 5; pointer-events: none; }

@media (max-width: 760px), (max-height: 520px) {
  .goal { width: min(300px, calc(100vw - 120px)); padding: 10px 12px; }
  .goal h1 { font-size: 18px; }
  .goal p { font-size: 13px; }
  .tool { width: 60px; min-height: 56px; font-size: 11px; }
  .sampler { display: none; }
  .act span:not(.ic) { display: none; }
  .act { padding: 0 12px; }
  .hintbox { top: auto; bottom: calc(var(--bot) + 64px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
<canvas id="view" aria-label="흙과 물 디오라마"></canvas>

<div id="labels" aria-hidden="true"></div>

<!-- 실험 화면 -->
<div id="hud" hidden>
  <section class="goal" aria-live="polite">
    <div class="eyebrow" id="hudGroup"></div>
    <h1 id="hudTitle"></h1>
    <p id="hudGoal"></p>
    <div class="meter"><div class="meter-fill" id="hudMeter"></div></div>
    <div class="meter-label"><span id="hudValLabel"></span><span id="hudVal" class="num"></span></div>
    <div class="budgets" id="hudBudgets"></div>
  </section>

  <section class="topright">
    <div class="ctlgroup" id="hudControls"></div>
    <div class="ctlgroup speed" role="group" aria-label="시간 빠르기">
      <button class="chip" id="spPause" aria-label="멈춤">❚❚</button>
      <button class="chip on" id="sp1" aria-label="보통 빠르기">▶</button>
      <button class="chip" id="sp3" aria-label="빠르게">▶▶</button>
    </div>
    <button class="chip icon" id="btnSound" aria-label="소리 켜기/끄기"></button>
  </section>

  <nav class="tools" id="hudTools" aria-label="도구"></nav>

  <section class="actions">
    <button class="act" id="btnUndo"><span class="ic" data-ic="undo"></span><span>되돌리기</span></button>
    <button class="act" id="btnReset"><span class="ic" data-ic="reset"></span><span>처음 모습으로</span></button>
    <button class="act" id="btnHint"><span class="ic" data-ic="hint"></span><span>힌트</span></button>
    <button class="act" id="btnMenu"><span class="ic" data-ic="grid"></span><span>실험 목록</span></button>
  </section>

  <section class="center-actions">
    <button class="big" id="btnEvent" hidden></button>
    <button class="big ice" id="btnFreeze" hidden><span class="ic" data-ic="freeze"></span><span>얼리기</span> <span class="num" id="freezeLeft"></span></button>
  </section>

  <section class="sampler" id="sampler" hidden>
    <div class="sampler-head">알갱이 측정기</div>
    <div id="samplerRows"></div>
    <div class="legend"><i class="lg g"></i>자갈 <i class="lg s"></i>모래 <i class="lg m"></i>고운 흙</div>
  </section>

  <div class="hintbox" id="hintBox" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<!-- 첫 화면 -->
<div id="title" class="screen">
  <div class="title-card">
    <div class="eyebrow">3학년 과학 · 지표의 변화</div>
    <h1 class="brand">꼬마 강 연구소</h1>
    <p class="lede">흙을 파고 쌓고, 비를 내려 보세요.<br>흐르는 물이 땅을 어떻게 바꾸는지 손으로 알아보는 실험실이에요.</p>
    <div class="title-actions">
      <button class="primary" id="btnStart">실험실 들어가기</button>
      <button class="ghost" id="btnNoteT">실험 노트</button>
      <button class="ghost" id="btnParentT">보호자</button>
    </div>
    <p class="fineprint">소리가 있어요. 마우스: 끌어서 파기 · Shift+끌기 쌓기 · 오른쪽 버튼으로 끌어 회전 · 휠 확대<br>태블릿: 도구를 고르고 한 손가락으로 문지르기 · 두 손가락으로 돌리고 키우기</p>
  </div>
</div>

<!-- 실험 목록 -->
<div id="map" class="screen" hidden>
  <header class="map-head">
    <div>
      <div class="eyebrow">꼬마 강 연구소</div>
      <h1>실험 목록</h1>
    </div>
    <div class="map-tools">
      <span class="starcount num" id="starTotal"></span>
      <button class="ghost" id="btnNote">실험 노트</button>
      <button class="ghost" id="btnParent">보호자</button>
      <button class="ghost" id="btnHome">처음 화면</button>
    </div>
  </header>
  <div class="map-groups" id="mapGroups"></div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
