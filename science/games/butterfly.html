<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1814">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>[hidden]:not([hidden=until-found i]){display:none!important}html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}</style>
<title>배추흰나비 키우기</title>
<link rel="stylesheet" href="../font/fonts.css">
<style>
/* 레이아웃: 화면 전체가 사육 상자, 그 위에 얇은 유리판 같은 패널이 가장자리에 붙는다 */
:root {
  --ink: #1f2b1c;          /* 이끼색 먹 */
  --ink-soft: #4b5a45;
  --glass: rgba(246, 247, 240, 0.86);
  --glass-strong: rgba(250, 250, 245, 0.95);
  --line: rgba(31, 43, 28, 0.14);
  --sage: #5f7d50;         /* 케일 잎 */
  --sage-deep: #3f5a34;
  --yolk: #d9a632;         /* 유채꽃 노랑: 별, 주요 단추 */
  --yolk-soft: #f3dfa4;
  --warn: #a9502b;
  --ground: #27311f;
  --font-display: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --font-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r: 14px;
  --tap: 52px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--font-ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.tool-lens { cursor: none; }
#scene.tool-brush, #scene.tool-ruler { cursor: crosshair; }
button { font: inherit; color: inherit; }
.glass { background: var(--glass); backdrop-filter: blur(12px) saturate(1.1); -webkit-backdrop-filter: blur(12px) saturate(1.1); border: 1px solid rgba(255, 255, 255, 0.65); box-shadow: 0 8px 28px rgba(20, 30, 15, 0.18), 0 1px 0 rgba(255, 255, 255, 0.7) inset; border-radius: var(--r); }
.btn { min-height: var(--tap); min-width: var(--tap); border: 1px solid var(--line); background: var(--glass-strong); border-radius: 12px; padding: 0 16px; font-size: 15px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.08s, background 0.15s, box-shadow 0.15s; touch-action: manipulation; }
.btn:hover { background: #fff; }
.btn:active { transform: scale(0.96); }
.btn:focus-visible, .tool:focus-visible, .opt:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }
.btn.primary { background: var(--sage-deep); color: #f6f4e8; border-color: transparent; }
.btn.primary:hover { background: var(--sage); }
.btn.on { background: var(--yolk-soft); border-color: rgba(217, 166, 50, 0.6); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* 위쪽 띠 */
#topbar { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.brand { padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; min-height: var(--tap); }
.brand { white-space: nowrap; }
.btn, .brand b, #stageChip { white-space: nowrap; }
.brand b { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
#stageChip { padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; font-weight: 600; font-size: 14px; border-radius: 999px; background: var(--sage-deep); color: #f3f1e4; }
#meters { display: flex; gap: 12px; padding: 8px 14px; align-items: center; min-height: var(--tap); box-sizing: border-box; flex-wrap: wrap; }
.meter { display: grid; grid-template-columns: auto 52px; align-items: center; column-gap: 6px; font-size: 12px; color: var(--ink-soft); }
.meter .bar { height: 7px; border-radius: 4px; background: rgba(31, 43, 28, 0.12); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 50%; background: var(--sage); border-radius: 4px; transition: width 0.4s, background 0.4s; }
.meter.low .bar i { background: var(--warn); }
.meter.low { color: var(--warn); font-weight: 600; }
.meter .val { grid-column: 1 / -1; font-variant-numeric: tabular-nums; display: none; }
.spacer { flex: 1; }
.topbtns { display: flex; gap: 8px; }

/* 미션 카드 */
#mission { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 80px; width: min(330px, 34vw); padding: 16px 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 170px); overflow: auto; }
.m-step { font-size: 12px; letter-spacing: 0.06em; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
#mission h2 { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.3; text-wrap: balance; }
#mGoal { margin: 0; font-size: 15px; line-height: 1.6; }
#mWait { margin: 0; font-size: 13px; color: var(--sage-deep); background: rgba(95, 125, 80, 0.1); border-radius: 10px; padding: 8px 10px; line-height: 1.5; }
#mHint { margin: 0; font-size: 14px; line-height: 1.55; background: rgba(217, 166, 50, 0.14); border-radius: 10px; padding: 8px 10px; }
.m-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stars { display: inline-flex; gap: 2px; font-size: 16px; color: rgba(31, 43, 28, 0.2); }
.stars .on { color: var(--yolk); }
.m-items { display: flex; gap: 8px; }
.item { flex: 1; touch-action: none; }
.m-progress { display: flex; gap: 3px; }
.m-progress i { flex: 1; height: 4px; border-radius: 2px; background: rgba(31, 43, 28, 0.12); }
.m-progress i.done { background: var(--yolk); }
.m-progress i.cur { background: var(--sage); }

/* 도구 줄 */
#tools { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 80px; padding: 8px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100% - 170px); overflow: auto; }
.tool { flex-shrink: 0; width: 64px; min-height: 60px; border-radius: 12px; border: 1px solid transparent; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--ink); touch-action: none; }
.tool svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: rgba(255, 255, 255, 0.6); }
.tool.on { background: var(--sage-deep); color: #f4f2e6; }
.tool.leaf { background: rgba(95, 125, 80, 0.14); }
.tools-sep { height: 1px; background: var(--line); margin: 2px 6px; }

/* 시간 띠 */
#timebar { position: absolute; bottom: max(10px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 8px; display: flex; gap: 8px; align-items: center; }
#speedLabel { font-size: 13px; color: var(--ink-soft); padding: 0 8px; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }

#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: 78px; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, 46vw); }
.toast { padding: 10px 16px; font-size: 14px; line-height: 1.5; text-align: center; animation: toastIn 0.3s ease-out; max-width: 100%; }
.toast.warn { border-color: rgba(169, 80, 43, 0.4); color: #6b2f16; }
.toast.good b { color: var(--sage-deep); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } }

#chip { position: absolute; padding: 6px; display: none; gap: 6px; z-index: 6; }
#readout { position: absolute; padding: 6px 12px; font-size: 14px; font-weight: 600; pointer-events: none; display: none; z-index: 5; font-variant-numeric: tabular-nums; }

/* 모달 */
#modal { position: absolute; inset: 0; background: rgba(18, 24, 14, 0.42); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; box-sizing: border-box; }
#modal.open { display: flex; }
.sheet { background: var(--glass-strong); border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); width: min(720px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
.sheet.wide { width: min(980px, 100%); }
.sheet .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--sage-deep); font-weight: 600; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-size: 23px; line-height: 1.35; text-wrap: balance; }
.sheet p { margin: 0; font-size: 15px; line-height: 1.65; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 56px; text-align: left; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-size: 16px; line-height: 1.45; cursor: pointer; }
.opt:hover { border-color: var(--sage); }
.opt.right { border-color: var(--sage); background: rgba(95, 125, 80, 0.14); }
.opt.wrong { border-color: var(--warn); background: rgba(169, 80, 43, 0.08); animation: shake 0.3s; }
.opt.picked { border-color: var(--yolk); background: rgba(217, 166, 50, 0.14); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.feedback { font-size: 15px; line-height: 1.6; padding: 10px 14px; border-radius: 12px; background: rgba(95, 125, 80, 0.12); }
.feedback.no { background: rgba(169, 80, 43, 0.1); }
.row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.big-stars { font-size: 40px; letter-spacing: 6px; color: rgba(31, 43, 28, 0.18); text-align: center; }
.big-stars .on { color: var(--yolk); }

/* 관찰 일지 */
.journal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.jcard { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.jcard .ph { aspect-ratio: 16 / 10; background: repeating-linear-gradient(135deg, rgba(95, 125, 80, 0.08) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 13px; max-width: 100%; }
.jcard .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.jcard .tx { padding: 8px 10px 10px; font-size: 13px; line-height: 1.5; }
.jcard .tx b { font-family: var(--font-display); font-size: 15px; display: block; }
.jcard.empty .tx { color: var(--ink-soft); }
.jtimeline { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }

/* 퍼즐 */
.puzzle { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.svgwrap { position: relative; background: #f7f6ef; border-radius: 14px; border: 1px solid var(--line); }
.svgwrap svg { width: 100%; height: auto; display: block; }
.dz { position: absolute; transform: translate(-50%, -50%); min-width: 64px; min-height: 40px; border: 2px dashed rgba(63, 90, 52, 0.45); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: rgba(255, 255, 255, 0.55); box-sizing: border-box; }
.dz.ok { border-style: solid; border-color: var(--sage); background: #eaf0df; color: var(--sage-deep); }
.dz.hot { border-color: var(--yolk); background: #fbf2d6; }
.labels { display: flex; flex-wrap: wrap; gap: 8px; }
.dragcard { min-height: 52px; min-width: 76px; padding: 6px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; cursor: grab; touch-action: none; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); }
.dragcard.dragging { box-shadow: 0 12px 26px rgba(0, 0, 0, 0.22); z-index: 50; position: relative; cursor: grabbing; }
.dragcard.placed { opacity: 0.35; pointer-events: none; }
.qrow { display: flex; flex-direction: column; gap: 6px; }
.qrow .q { font-size: 14px; font-weight: 600; }
.qrow .opts2 { display: flex; gap: 6px; flex-wrap: wrap; }
.qrow .opt { min-height: 48px; padding: 6px 12px; font-size: 15px; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { min-height: 150px; border: 2px dashed rgba(63, 90, 52, 0.4); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: var(--ink-soft); position: relative; }
.slot.hot { border-color: var(--yolk); background: #fbf2d6; }
.slot .num { position: absolute; top: 6px; left: 8px; font-size: 12px; font-weight: 600; }
.lifecard { width: 100%; max-width: 150px; min-height: 130px; flex-direction: column; gap: 4px; padding: 8px; box-sizing: border-box; }
.lifecard svg, .lifecard img { width: 100%; height: 74px; object-fit: cover; border-radius: 8px; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { min-height: 200px; border: 2px dashed rgba(63, 90, 52, 0.4); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bin h4 { margin: 0; font-size: 15px; font-family: var(--font-display); }
.bin small { color: var(--ink-soft); font-size: 12px; }
.bin.hot { border-color: var(--yolk); background: #fbf2d6; }
.bin .dragcard { width: 100%; justify-content: flex-start; flex-direction: column; align-items: flex-start; }
.insect-card { flex-direction: column; align-items: flex-start; gap: 2px; min-width: 140px; }
.insect-card small { font-weight: 400; font-size: 12px; color: var(--ink-soft); }

/* 보호자 */
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; justify-content: center; }
.keypad .btn { font-size: 20px; }
.gate-q { font-size: 30px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.gate-a { font-size: 26px; text-align: center; min-height: 40px; font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }
table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rec th, table.rec td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.rec td.n { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.stat span { font-size: 12px; color: var(--ink-soft); }

/* 시작 화면 */
#start { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: flex-start; padding: 0 max(28px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px)); background: linear-gradient(90deg, rgba(20, 28, 16, 0.72) 0%, rgba(20, 28, 16, 0.35) 45%, rgba(20, 28, 16, 0) 70%); }
#start .card { max-width: 480px; color: #f4f2e6; display: flex; flex-direction: column; gap: 14px; }
#start .kicker { font-size: 13px; letter-spacing: 0.12em; color: #d8dcc4; }
#start h1 { margin: 0; font-family: var(--font-display); font-size: clamp(34px, 5vw, 56px); line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; }
#start p { margin: 0; font-size: 16px; line-height: 1.7; color: #e5e4d6; }
#start .row { justify-content: flex-start; }
#start .facts { display: flex; gap: 18px; font-size: 13px; color: #d4d6c2; flex-wrap: wrap; }
#start .facts b { display: block; font-family: var(--font-display); font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }

#rotate { position: absolute; inset: 0; z-index: 40; background: var(--ground); color: #f4f2e6; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; font-size: 18px; }
#rotate svg { width: 90px; height: 90px; stroke: #f4f2e6; fill: none; stroke-width: 1.5; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

#ghost { position: fixed; z-index: 60; pointer-events: none; display: none; transform: translate(-50%, -50%); font-size: 13px; padding: 8px 12px; }

@media (max-width: 1280px) {
  .meter { grid-template-columns: auto 30px; }
  .topbtns .btn { padding: 0 12px; font-size: 14px; }
  #meters { gap: 8px; }
}
@media (max-width: 900px) {
  #mission { width: 270px; }
  #mission h2 { font-size: 18px; }
  .meter span.lab { font-size: 11px; }
  .journal, .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .puzzle { grid-template-columns: 1fr; }
}
@media (max-height: 560px) {
  #mission, #tools { top: 70px; max-height: calc(100% - 140px); }
  .tool { min-height: 50px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* 좁은 창(아티팩트 옆 패널 등) */
@media (max-width: 760px) {
  .brand b { display: none; }
  .brand { padding: 6px 10px; }
  #stageChip { min-height: 36px; padding: 0 10px; font-size: 13px; }
  #meters { padding: 6px 10px; gap: 6px; }
  .meter { grid-template-columns: auto 22px; font-size: 11px; }
  .topbtns .btn { padding: 0 10px; font-size: 13px; min-width: 48px; }
  #mission { width: 220px; padding: 12px; gap: 8px; }
  #mission h2 { font-size: 16px; }
  #mGoal { font-size: 13px; }
  .tool { width: 54px; font-size: 11px; }
  #timebar .btn { padding: 0 10px; font-size: 13px; }
  #speedLabel { display: none; }
  #toasts { width: 60vw; }
}

</style>

<div id="app">
  <canvas id="scene" aria-label="배추흰나비 사육 상자"></canvas>

  <header id="topbar">
    <div class="brand glass"><b>배추흰나비 키우기</b><span id="clock">1일째 · 오전 8시</span></div>
    <div id="stageChip">알</div>
    <div id="meters" class="glass" aria-label="사육 상자 상태"></div>
    <div class="spacer"></div>
    <div class="topbtns">
      <button class="btn glass" id="btnJournal">관찰 일지</button>
      <button class="btn glass" id="btnParent">보호자</button>
      <button class="btn glass" id="btnSound">소리</button>
    </div>
  </header>

  <aside id="mission" class="glass" aria-live="polite">
    <div class="m-step"><span id="mStep">미션 1 / 15</span><span class="stars" id="mStars"></span></div>
    <div class="m-progress" id="mProgress"></div>
    <h2 id="mTitle">사육 상자 꾸미기</h2>
    <p id="mGoal"></p>
    <p id="mWait" hidden></p>
    <div class="m-items" id="mItems" hidden>
      <button class="btn item" id="itemPaper" data-item="paper">휴지</button>
      <button class="btn item" id="itemLid" data-item="lid">방충망</button>
    </div>
    <p id="mHint" hidden></p>
    <div class="m-actions">
      <button class="btn" id="btnHint">힌트 보기</button>
      <button class="btn primary" id="btnAnswer" hidden>답하기</button>
    </div>
  </aside>

  <nav id="tools" class="glass" aria-label="도구">
    <button class="tool on" data-tool="hand" id="toolHand" title="손: 잎 들추기, 화면 돌리기"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v6m0-3a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4.2 16a1.6 1.6 0 0 1 2.5-2L8 15.5"/></svg>손</button>
    <button class="tool" data-tool="lens" id="toolLens" title="돋보기"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/><path d="M7 8.5a3.5 3.5 0 0 1 3-2"/></svg>돋보기</button>
    <button class="tool" data-tool="ruler" id="toolRuler" title="자"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>자</button>
