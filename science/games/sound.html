<title>소리 마을 악단</title>
<meta name="description" content="초등학교 3학년 과학 「소리의 성질」 단원 학습 게임">
<link rel="stylesheet" href="../font/fonts.css">
<style>
/* 소리 마을 악단 — 한지와 먹, 주칠과 청자색. 한 가지 분위기로 고정(따뜻한 디오라마 작업실). */
/* 배치: 화면 전체가 3D 디오라마, 그 위에 한지 카드가 필요한 만큼만 떠 있다. */
:root {
  --ink: #2a2420;
  --ink-soft: #5b5047;
  --hanji: #f3ecdd;
  --hanji-2: #e6dbc5;
  --hanji-edge: #cdbd9f;
  --vermilion: #a4472f;
  --celadon: #4d776c;
  --ochre: #b98a3e;
  --night: #221d1a;
  --glow: #ffe2a8;
  --scrim: rgba(28, 22, 18, 0.55);
  --font-display: 'Gowun Batang', 'Nanum Myeongjo', 'Noto Serif KR', 'AppleMyungjo', serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --r: 14px;
  --touch: 52px;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font-family: var(--font-body); font-size: 16px; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
[hidden] { display: none !important; }

.paper {
  background: var(--hanji);
  background-image: radial-gradient(rgba(140, 110, 70, 0.07) 1px, transparent 1.2px), radial-gradient(rgba(140, 110, 70, 0.05) 1px, transparent 1.4px);
  background-size: 7px 7px, 11px 13px;
  border: 1px solid var(--hanji-edge);
  border-radius: var(--r);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 10px 28px rgba(20, 12, 6, 0.35), 0 2px 6px rgba(20, 12, 6, 0.25);
}
.btn {
  min-height: var(--touch); min-width: var(--touch); padding: 0 20px; border-radius: 999px;
  border: 1px solid var(--hanji-edge); background: var(--hanji); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; white-space: nowrap;
  box-shadow: 0 2px 0 var(--hanji-edge), 0 6px 14px rgba(20, 12, 6, 0.18);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
}
.btn:active, .btn.pressed { transform: translateY(2px) scale(0.98); box-shadow: 0 0 0 var(--hanji-edge), 0 2px 6px rgba(20, 12, 6, 0.2); }
.btn.primary { background: var(--vermilion); color: #fbf3e6; border-color: #7f3322; box-shadow: 0 2px 0 #6e2b1c, 0 8px 18px rgba(80, 20, 10, 0.3); }
.btn.quiet { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-soft); }
.icon-btn { width: var(--touch); height: var(--touch); padding: 0; border-radius: 50%; }
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ───── 화면: 시작 ───── */
#screen-title { position: absolute; inset: 0; display: grid; place-items: center start; padding-left: max(5vw, 16px); box-sizing: border-box; background: radial-gradient(ellipse at 65% 55%, rgba(34, 29, 26, 0) 0%, rgba(34, 29, 26, 0.4) 75%); }
.title-card { padding: 34px 40px 28px; text-align: left; max-width: 440px; width: calc(100% - 32px); box-sizing: border-box; }
.title-card .eyebrow { font-size: 14px; letter-spacing: 0.18em; color: var(--ink-soft); }
.title-card h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 5vw, 50px); margin: 10px 0 6px; letter-spacing: 0.04em; text-wrap: balance; }
.title-card h1 .seal { display: inline-block; vertical-align: 0.35em; margin-left: 10px; width: 30px; height: 30px; border-radius: 6px; background: var(--vermilion); color: #fbf0e0; font-size: 15px; line-height: 30px; letter-spacing: 0; transform: rotate(4deg); }
.title-card p { color: var(--ink-soft); line-height: 1.7; margin: 8px 0 22px; text-wrap: balance; }
.title-actions { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; }

/* ───── 화면: 마을 지도 ───── */
#screen-map { position: absolute; inset: 0; pointer-events: none; }
.map-panel { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 16px; bottom: 16px; width: min(400px, 46vw); display: flex; flex-direction: column; pointer-events: auto; overflow: hidden; }
.map-head { padding: 18px 20px 10px; border-bottom: 1px dashed var(--hanji-edge); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.map-head h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }
.map-head .stars-total { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 15px; white-space: nowrap; }
.map-list { overflow-y: auto; padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; }
.group { padding: 10px 6px 6px; }
.group h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 2px; display: flex; gap: 8px; align-items: baseline; }
.group h3 .num { color: var(--vermilion); font-size: 15px; }
.group .place { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { min-height: 58px; text-align: left; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--hanji-edge); background: #fbf7ee; display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: transform 0.08s, background 0.2s; }
.chip:active { transform: scale(0.98); }
.chip .id { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chip .t { font-size: 15px; line-height: 1.25; }
.chip .st { font-size: 13px; letter-spacing: 2px; color: var(--ochre); }
.chip[disabled] { opacity: 0.45; cursor: not-allowed; }
.chip.next { border-color: var(--vermilion); box-shadow: 0 0 0 2px rgba(164, 71, 47, 0.18); }
.map-tools { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: 16px; display: flex; gap: 10px; pointer-events: auto; flex-wrap: wrap; }
.map-title { position: absolute; left: max(20px, env(safe-area-inset-left)); top: 18px; color: #f6ead6; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); pointer-events: none; }
.map-title .unit { font-size: 14px; letter-spacing: 0.14em; opacity: 0.85; }
.map-title .name { font-family: var(--font-display); font-size: 30px; font-weight: 700; }

/* ───── 스테이지 HUD ───── */
#hud { position: absolute; left: max(16px, env(safe-area-inset-left)); top: 14px; max-width: min(340px, 38vw); padding: 12px 16px 12px; pointer-events: auto; }
#hud .sid { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.06em; }
#hud h2 { font-family: var(--font-display); font-size: 22px; margin: 2px 0 8px; }
#hud ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#hud li { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; line-height: 1.35; }
#hud li .box { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink-soft); margin-top: 1px; display: grid; place-items: center; transition: background 0.3s, border-color 0.3s; }
#hud li.done .box { background: var(--celadon); border-color: var(--celadon); }
#hud li.done .box::after { content: ''; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
#hud li.done { color: var(--ink-soft); }
#hud li.pop .box { animation: pop 0.45s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
#hud .controls { margin-top: 8px; font-size: 13px; color: var(--ink-soft); line-height: 1.45; border-top: 1px dashed var(--hanji-edge); padding-top: 8px; }
#tools { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 14px; display: flex; gap: 8px; }
#tools .btn { position: relative; }
#tools .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ochre); color: #fff; font-size: 11px; display: grid; place-items: center; }
#readout { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 16px; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; gap: 16px; align-items: center; }
#readout b { font-weight: 700; color: var(--vermilion); }

/* 세기 막대 */
#meter-strength { position: absolute; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 56px); transform: translateX(-50%); width: min(360px, 60vw); padding: 10px 14px 12px; }
#meter-strength .lbl { font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 6px; }
#meter-strength .track { position: relative; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #e6dbc5, #d7c6a4); overflow: hidden; border: 1px solid var(--hanji-edge); }
#meter-strength .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--celadon), var(--ochre) 60%, var(--vermilion)); border-radius: 7px; transition: width 0.04s linear; }
#meter-strength .zone { position: absolute; top: -2px; bottom: -2px; border: 2px solid var(--ink); border-radius: 6px; opacity: 0.55; }

/* 높낮이 막대 */
#meter-pitch { position: absolute; right: max(16px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); width: 112px; height: min(360px, 56vh); padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; }
#meter-pitch .lbl { font-size: 13px; text-align: center; color: var(--ink-soft); margin-bottom: 8px; }
#meter-pitch .scale { position: relative; flex: 1; border-left: 2px solid var(--hanji-edge); margin-left: 40px; }
#meter-pitch .tick { position: absolute; left: -40px; width: 36px; text-align: right; font-size: 11px; color: var(--ink-soft); transform: translateY(-50%); }
#meter-pitch .tick::after { content: ''; position: absolute; right: -10px; top: 50%; width: 6px; border-top: 1px solid var(--hanji-edge); }
#meter-pitch .mark { position: absolute; left: -6px; right: -8px; height: 0; transition: top 0.25s cubic-bezier(.3,1.4,.5,1); }
#meter-pitch .mark span { position: absolute; left: 14px; top: -11px; font-size: 13px; white-space: nowrap; padding: 1px 6px; border-radius: 6px; }
#meter-pitch .mark.target { border-top: 3px dashed var(--celadon); }
#meter-pitch .mark.target span { background: var(--celadon); color: #fff; }
#meter-pitch .mark.you { border-top: 3px solid var(--vermilion); }
#meter-pitch .mark.you span { background: var(--vermilion); color: #fff; top: 2px; }
#meter-pitch .mark.ok span { background: var(--ochre); }

/* 월드 이름표 */
#tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); padding: 4px 10px; border-radius: 10px; font-size: 14px; background: rgba(243, 236, 221, 0.94); border: 1px solid var(--hanji-edge); box-shadow: 0 4px 10px rgba(20, 12, 6, 0.25); white-space: nowrap; transition: opacity 0.25s, background 0.25s; }
.tag.btnlike { pointer-events: auto; min-height: 48px; min-width: 48px; padding: 4px 14px; display: grid; place-items: center; cursor: pointer; font-size: 15px; }
.tag.ok { background: var(--celadon); color: #fff; border-color: #3a5c53; }
.tag.now { background: var(--vermilion); color: #fff; border-color: #7f3322; }
.tag.dim { opacity: 0.55; }
.tag.small { font-size: 12px; padding: 2px 8px; }
.tag.plain { background: transparent; border: none; box-shadow: none; color: #f6ead6; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }

#toast { position: absolute; left: 50%; top: 18px; transform: translate(-50%, -20px); opacity: 0; padding: 10px 18px; font-size: 17px; pointer-events: none; transition: opacity 0.25s, transform 0.25s; max-width: 46vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───── 모달 ───── */
#modal { position: absolute; inset: 0; display: grid; place-items: center; background: var(--scrim); padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); box-sizing: border-box; z-index: 20; animation: fadein 0.25s ease; }
@keyframes fadein { from { opacity: 0; } }
.dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px 26px 20px; box-sizing: border-box; animation: rise 0.35s cubic-bezier(.2,1.3,.4,1); }
@keyframes rise { from { transform: translateY(18px) scale(0.97); opacity: 0; } }
.dialog .kicker { font-size: 13px; letter-spacing: 0.12em; color: var(--vermilion); }
.dialog h3 { font-family: var(--font-display); font-size: 24px; margin: 4px 0 12px; line-height: 1.35; text-wrap: balance; }
.dialog p { line-height: 1.7; margin: 0 0 12px; color: var(--ink); }
.dialog .opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 6px; }
.dialog .opt { min-height: var(--touch); border-radius: 12px; border: 1px solid var(--hanji-edge); background: #fbf7ee; text-align: left; padding: 10px 16px; font-size: 17px; display: flex; gap: 12px; align-items: center; transition: background 0.2s, border-color 0.2s, transform 0.08s; }
.dialog .opt:active { transform: scale(0.99); }
.dialog .opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--hanji-2); font-size: 14px; }
.dialog .opt.right { background: #e3efe9; border-color: var(--celadon); }
.dialog .opt.right .k { background: var(--celadon); color: #fff; }
.dialog .opt.wrong { background: #f4e2db; border-color: var(--vermilion); }
.dialog .opt.picked .k { background: var(--ochre); color: #fff; }
.dialog .explain { background: rgba(77, 119, 108, 0.1); border-left: 3px solid var(--celadon); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 10px 0; line-height: 1.65; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.stars { display: flex; gap: 14px; justify-content: center; margin: 6px 0 12px; }
.stars .s { width: 54px; height: 54px; color: var(--hanji-edge); transition: color 0.3s, transform 0.3s; }
.stars .s.on { color: var(--ochre); animation: starpop 0.5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes starpop { from { transform: scale(0.3) rotate(-30deg); } }
.star-why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 13px; color: var(--ink-soft); text-align: center; margin-bottom: 8px; }
.star-why .on { color: var(--ink); }
.cardlet { border: 1px solid var(--hanji-edge); border-radius: 12px; padding: 12px 14px; background: #fbf7ee; }
.cardlet .ct { font-family: var(--font-display); font-size: 17px; margin-bottom: 4px; }
.cardlet p { margin: 0; font-size: 15px; line-height: 1.6; }

/* 실험 노트 */
.notebook { width: min(860px, 100%); }
.tabs { display: flex; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
.tabs button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--hanji-edge); background: #fbf7ee; }
.tabs button[aria-selected='true'] { background: var(--ink); color: var(--hanji); border-color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cards .cardlet.locked { opacity: 0.55; }
.cards .cardlet .src { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

/* 보호자 */
.parent-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.parent-table th, .parent-table td { border-bottom: 1px solid var(--hanji-2); padding: 7px 6px; text-align: left; white-space: nowrap; }
.parent-table th { font-weight: 700; color: var(--ink-soft); font-size: 13px; }
.table-wrap { overflow-x: auto; max-height: 52vh; }
.gate-input { font: inherit; font-size: 24px; width: 120px; min-height: var(--touch); border-radius: 12px; border: 1px solid var(--hanji-edge); padding: 0 12px; background: #fff; text-align: center; }
.slider { display: grid; grid-template-columns: 90px 1fr 44px; gap: 10px; align-items: center; margin: 10px 0; }
.slider input { width: 100%; height: 40px; accent-color: var(--vermilion); }

#fade { position: absolute; inset: 0; background: var(--night); opacity: 0; pointer-events: none; transition: opacity 0.45s ease; z-index: 30; }
#fade.on { opacity: 1; pointer-events: auto; }

#rotate { position: fixed; inset: 0; background: var(--night); color: var(--hanji); display: none; place-items: center; text-align: center; z-index: 50; padding: 24px; box-sizing: border-box; }
#rotate .phone { width: 46px; height: 78px; border: 3px solid var(--hanji); border-radius: 10px; margin: 0 auto 18px; animation: turn 2.2s ease-in-out infinite; }
#rotate h2 { font-family: var(--font-display); font-size: 26px; margin: 0 0 8px; }
#rotate p { margin: 0; opacity: 0.8; line-height: 1.6; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { #rotate { display: grid; } }

@media (max-height: 520px) {
  #hud { padding: 8px 12px; }
  #hud h2 { font-size: 18px; margin-bottom: 4px; }
  #hud li { font-size: 13px; }
  #hud .controls { display: none; }
  .dialog { padding: 14px 18px; }
  .dialog h3 { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
#hud { pointer-events: none; }
#hud.compact .controls { display: none; }
#hud.compact h2 { font-size: 18px; margin-bottom: 4px; }
#hud.compact li { font-size: 14px; }
.btn svg { width: 22px; height: 22px; flex: none; }

</style>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="소리 마을 디오라마"></canvas>
  <div id="tags"></div>
  <header id="hud" class="paper" hidden></header>
  <nav id="tools" hidden></nav>
  <div id="readout" class="paper" hidden></div>
  <div id="meter-strength" class="paper" hidden></div>
  <div id="meter-pitch" class="paper" hidden></div>
  <div id="toast" class="paper" role="status" aria-live="polite"></div>
  <section id="screen-title">
    <div class="title-card paper">
      <div class="eyebrow">3학년 과학 · 소리의 성질</div>
      <h1>소리 마을 악단<span class="seal">樂</span></h1>
      <p>북, 가야금, 대금, 물병 실로폰으로 소리가 어떻게 생기고 퍼지는지 직접 실험해 봐요. 소리를 켜고 시작하세요.</p>
      <div class="title-actions"><button class="btn primary" disabled>불러오는 중…</button></div>
    </div>
  </section>
  <section id="screen-map" hidden></section>
  <div id="modal" hidden></div>
  <div id="fade"></div>
  <div id="rotate"><div><div class="phone"></div><h2>가로로 돌려 주세요</h2><p>소리 마을은 가로 화면에서 볼 수 있어요.</p></div></div>

.tuned[t.i]=!1,zp(t.f,ma.target))},done:i=>i.tuned.slice()},{id:"3-3",group:2,key:"bottles",title:"물병 실로폰",story:'유리병 다섯 개로 실로폰을 만들어요. 병 속 물의 높이를 바꿔 "도 레 미 솔 라"를 만들어 봐요. (이번에는 병을 두드려서 소리를 내요.)',controls:"병을 누른 채 위아래로 끌면 물 높이가 바뀌어요. 병을 톡 누르면 채로 두드려요. 이름표를 누르면 맞춰야 할 음이 들려요.",steps:Nc.targets.map(i=>`${ds(i)} 병 맞추기`),predict:{q:"병을 두드릴 때 물이 많은 병은 물이 적은 병보다 어떤 소리가 날까요?",options:["낮은 소리","높은 소리","같은 소리"],answer:0},observe:{q:"두드릴 때 가장 높은 소리가 난 병은 어느 병이었나요?",options:["물이 가장 적은 병","물이 가장 많은 병","모두 같았어요"],answer:0,explain:"병을 두드리면 병과 물이 함께 떨려요. 물이 많을수록 느리게 떨려 낮은 소리가 납니다. 병 입구를 불 때는 병 속 공기가 떨리기 때문에 반대로 물이 많을수록(공기 기둥이 짧을수록) 높은 소리가 나요."},hints:["두드려 보고 소리가 높으면 물을 더 붓고(위로 끌기), 낮으면 물을 덜어 내세요(아래로 끌기).","도 병은 거의 가득, 라 병은 3분의 1쯤이에요."],card:{title:"불 때는 반대!",body:'병 입구에 입을 대고 "후—" 불면 병 속 공기 기둥이 떨려요. 이때는 물이 많을수록 공기 기둥이 짧아져 높은 소리가 나요. 두드릴 때와 반대랍니다.'},init:()=>({tuned:[!1,!1,!1,!1,!1]}),reduce(i,t){if(t.type!=="tap")return null;let e=Nc.targets[t.i];return Md(t.f,e)?(i.tuned[t.i]=!0,i.tuned.every(Boolean)?null:`${ds(e)}, 맞았어요!`):(i.tuned[t.i]=!1,$n(t.f,Jt(e))>0?"조금 높아요. 물을 더 부어 보세요.":"조금 낮아요. 물을 덜어 보세요.")},done:i=>i.tuned.slice()},{id:"3-4",group:2,key:"daegeum",title:"대금 소리 구멍",story:"대금은 대나무로 만든 가로 피리예요. 구멍을 막고 열어 관 속 공기 기둥의 길이를 바꾸면 높낮이가 달라져요. 악보대로 불어 봐요.",controls:"구멍을 눌러 막거나 열어요. 왼쪽 취구를 누르고 있는 동안 소리가 나요. 태블릿에서는 한 손가락으로 불면서 다른 손가락으로 구멍을 바꿀 수 있어요.",steps:pa.melody.map((i,t)=>`${t+1}번째 음: ${ds(i)}`),predict:{q:"구멍을 모두 막으면 소리는 어떻게 될까요?",options:["가장 낮은 소리가 나요","가장 높은 소리가 나요","소리가 안 나요"],answer:0},observe:{q:"취구에 가까운 구멍을 열었을 때 소리는 어떻게 되었나요?",options:["높아졌어요","낮아졌어요","작아졌어요"],answer:0,explain:"취구에서 가장 가까운 열린 구멍까지가 떨리는 공기 기둥이에요. 가까운 구멍을 열수록 공기 기둥이 짧아져 높은 소리가 나요."},hints:['구멍을 모두 막으면 "솔", 하나씩 열수록 높아져요.',"악보 음 이름표를 누르면 그 음을 내는 손가락 모양이 잠깐 보여요."],card:{title:"리코더 구멍",body:"리코더도 구멍을 모두 막으면 낮은 소리, 위쪽 구멍을 열수록 높은 소리가 나요. 관 속 공기 기둥의 길이가 달라지기 때문이에요."},init:()=>({idx:0}),reduce(i,t){if(t.type!=="blow"||i.idx>=pa.melody.length)return null;let e=pa.melody[i.idx];return Md(t.f,e,20)?(i.idx++,null):zp(t.f,e)||null},done:i=>pa.melody.map((t,e)=>i.idx>e)},{id:"4-1",group:3,key:"stringPhone",title:"실 전화",story:"종이컵 두 개를 실로 이었어요. 골목 끝 친구에게 실 전화로 노래를 보내 봐요.",controls:"친구를 좌우로 끌어 실을 팽팽하게 하거나 느슨하게 해요. 실을 누르면 빨래집게를 집거나 뺄 수 있어요. 왼쪽 컵을 누르면 노래를 보내요.",steps:["실을 팽팽하게 해서 노래 전하기","실이 느슨할 때 보내 보기","빨래집게로 실을 집고 보내 보기"],predict:{q:"실이 축 늘어져 있으면 소리가 잘 전달될까요?",options:["잘 전달되지 않아요","더 잘 전달돼요","똑같아요"],answer:0},observe:{q:"실 전화로 소리가 전달된 까닭은 무엇일까요?",options:["팽팽한 실이 떨림을 전해서","컵이 소리를 저장해서","바람이 소리를 날라서"],answer:0,explain:"컵에 대고 소리를 내면 컵 바닥이 떨리고, 그 떨림이 팽팽한 실을 따라 친구 컵까지 전해져요. 실이 느슨하거나 실을 잡으면 떨림이 전해지지 않아요."},hints:["친구를 오른쪽으로 끌어 실이 곧게 펴지게 해 보세요.","실 가운데를 누르면 빨래집게가 생겨요. 다시 누르면 빠져요."],card:{title:"청진기",body:"의사 선생님의 청진기는 관을 통해 심장 소리를 귀까지 전해 줘요. 소리는 여러 물질을 따라 전달돼요."},init:()=>({taut:!1,slack:!1,pinched:!1}),reduce(i,t){return t.type!=="send"?null:t.pinched?(i.pinched=!0,"빨래집게에서 떨림이 막혔어요."):t.tension<.5?(i.slack=!0,"실이 느슨해서 떨림이 전해지지 않았어요."):(i.taut=!0,"친구가 노래를 들었어요!")},done:i=>[i.taut,i.slack,i.pinched]},{id:"4-2",group:3,key:"underwater",title:"물속 돌 부딪히기",story:"연못 속 물고기들은 수초 사이에 숨어 있어요. 물속에서 돌을 부딪치면 물고기가 소리를 들을 수 있을까요?",controls:"집게 손잡이를 위아래로 끌어 돌을 물속이나 물 밖에 두어요. 오른쪽 돌을 누른 채 끌었다 놓으면 두 돌이 부딪쳐요.",steps:["물 밖에서 돌을 부딪쳐 보기","물속에서 돌을 부딪쳐 물고기 세 마리 부르기"],predict:{q:"물속에서 돌을 부딪치면 물고기에게 소리가 전달될까요?",options:["전달돼요","전달되지 않아요","물이 소리를 지워요"],answer:0},observe:{q:"물고기들이 다가온 까닭은 무엇일까요?",options:["소리가 물을 통해 전달되어서","돌이 반짝여서","물이 따뜻해져서"],answer:0,explain:"소리는 물을 통해서도 전달돼요. 물 밖(공기)에서 낸 소리는 물 표면에서 대부분 되돌아가서 물속까지 잘 들어가지 못해요."},hints:["손잡이를 위로 끌어 돌이 물 밖에 있을 때 한 번 부딪쳐 보세요.","손잡이를 아래로 끌어 돌이 물에 잠기게 한 뒤 부딪쳐 보세요."],card:{title:"고래의 노래",body:"고래와 돌고래는 물속에서 소리를 내어 멀리 있는 친구와 이야기해요. 소리는 물속에서 멀리까지 전달돼요."},init:()=>({air:!1,fish:0}),reduce(i,t){return t.type!=="clack"?null:t.medium==="air"?(i.air=!0,"물고기들은 잘 못 들은 것 같아요."):t.s<.2?"너무 약해요. 조금 더 세게!":(i.fish=Math.min(3,i.fish+1),i.fish<3?`물고기가 다가와요! (${i.fish}/3)`:null)},done:i=>[i.air,i.fish>=3]},{id:"4-3",group:3,key:"woodEar",title:"나무를 타고 오는 소리",story:"기다란 평상 끝에 친구가 앉아 있어
