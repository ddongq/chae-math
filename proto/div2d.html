<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>나눗셈 개념 시안 (2D)</title>
<link rel="stylesheet" href="../style.css">
<style>
  body{background:#F3E7CF}
  .panel{box-shadow:0 5px 0 rgba(120,80,40,.16)}
  .pL{background:#FBF4E6}
  #sv{position:absolute;left:0;top:0;width:740px;height:565px;border-radius:28px}
  #tabs button.on{color:#6B4A2E}
  #ld{position:absolute;left:0;top:0;width:460px;height:565px}
  .ldg{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#2A2A3C}
  .ldg.g{color:#14995A}.ldg.b{color:#2F7BEA}.ldg.r{color:#E5484D}
  .ldg.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  .cband{position:absolute;border-radius:14px;transition:opacity .35s;opacity:0}
  .cband.g{background:#DBF4E5}.cband.b{background:#E3EEFF}
  .lline{position:absolute;height:4px;background:#2A2A3C;border-radius:2px;transform-origin:left;transition:transform .4s}
  #chk{position:absolute;left:0;width:460px;top:470px;text-align:center;font-size:26px;font-weight:800;color:#6B4A2E;opacity:0;transition:opacity .4s}
  #guide{position:absolute;left:0;top:0;width:120px;height:130px;display:flex;align-items:center;justify-content:center}
  #guide div{width:104px;height:104px;border-radius:50%;background:#fff;border:3px dashed #C9A97A;display:flex;align-items:center;justify-content:center;
             font-size:15px;font-weight:800;color:#9A7A55;text-align:center;line-height:1.3}
  .pill.w{background:#fff;color:#6B4A2E}
  .pill.opt{background:#fff;color:#2A2A3C;font-size:24px;min-width:110px}
  .plbl text{font-size:22px;font-weight:800;font-family:ui-rounded,"Apple SD Gothic Neo",sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div id="header">
    <div id="title">➗ 나눗셈 바다<small>개념 학습 시안 · 2D</small></div>
    <div id="tabs"></div>
  </div>
  <div class="panel pL"><svg id="sv" viewBox="0 0 740 565"></svg></div>
  <div class="panel pR"><div id="ld"></div><div id="chk"></div></div>
  <div id="bottom">
    <div id="guide"><div>루퍼드<br>그림 자리</div></div>
    <div id="bubble"></div>
    <div id="ctrls"></div>
  </div>
</div>

<script>
/* ---------- 화면 맞추기 ---------- */
const stage = document.getElementById('stage');
function fit(){ const de = document.documentElement, s = Math.min(de.clientWidth/1280, de.clientHeight/800); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ---------- 소리 ---------- */
let AC = null;
const unlock = () => { if (!AC) try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} };
function tone(f, d=.08, type='triangle', v=.12, slide=0){
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}
const SFX = { tok:()=>tone(520,.07,'triangle',.10,380), crack:()=>{tone(900,.05,'square',.05,300);tone(200,.12,'triangle',.12,120);},
  ding:()=>{tone(880,.18,'sine',.12);setTimeout(()=>tone(1320,.25,'sine',.10),110);}, write:()=>tone(660,.05,'sine',.06) };

/* ---------- 말풍선 · 버튼 ---------- */
const $ = id => document.getElementById(id);
const css = (e, o) => Object.assign(e.style, o);
const jo = (n, a, b) => [0,1,3,6,7,8].includes(n%10) ? a : b;   // 숫자 뒤 을/를
const say = html => { $('bubble').innerHTML = '<div>'+html+'</div>'; };
function buttons(list){
  const c = $('ctrls'); c.innerHTML = '';
  return new Promise(res=>list.forEach(o=>{ const b = document.createElement('button'); b.className = 'pill ' + (o.cls||''); b.innerHTML = o.label;
    b.onclick = ()=>{ unlock(); res(o.val); }; c.appendChild(b); }));
}
const clearBtns = () => { $('ctrls').innerHTML = ''; };

/* ---------- 움직임 ---------- */
const tweens = new Set();
let clockOff = 0; const now = () => performance.now() + clockOff;
const ease = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
const tw = (dur, f) => new Promise(res=>tweens.add({t0:now(), dur, f, res}));
const sleep = ms => tw(ms, ()=>{});
function frame(){ const n = now(); for (const t of [...tweens]){ const p = Math.min(1, (n-t.t0)/t.dur); t.f(p); if (p>=1){ tweens.delete(t); t.res(); } } }
(function loop(){ frame(); requestAnimationFrame(loop); })();
window.T = { async step(sec){ for (let t=0; t<sec*1000; t+=16){ clockOff += 16; frame(); for (let k=0;k<6;k++) await Promise.resolve(); } } };

/* ---------- 그림 (손그림 톤: 갈색 연필 선 + 단색 + 그림자 한 단계) ---------- */
const NS = 'http://www.w3.org/2000/svg', sv = $('sv');
const INK = '#6B4A2E';
const PAL = { ten:['#8ED3A9','#62B485'], one:['#9CC3F5','#7099DD'], red:['#F5A493','#DD7A65'] };
const C = 13;   // 한 칸
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent||sv).appendChild(e); return e; }
// 낱개 한 칸: 윗면 + 아래 그림자 띠 + 외곽선
function cell(g, x, pal){
  const c = el('g', {transform:`translate(${x},0)`}, g);
  const f = el('rect', {x:0, y:0, width:C, height:C, rx:2.5, fill:pal[0]}, c);
  const s = el('rect', {x:1, y:C*0.66, width:C-2, height:C*0.34-1, rx:1.5, fill:pal[1]}, c);
  el('rect', {x:0, y:0, width:C, height:C, rx:2.5, fill:'none', stroke:INK, 'stroke-width':1.4}, c);
  c._f = f; c._s = s; return c;
}
// 움직이는 물체: 자리(x,y)는 속성으로 들고 다니며 transform으로 그림
class Piece {
  constructor(n, pal, parent){ this.g = el('g', {}, parent); this.cells = []; for (let k=0;k<n;k++){ const c = cell(this.g, 0, pal); c.setAttribute('transform', `translate(0,${k*C})`); this.cells.push(c); } this.x = 0; this.y = 0; this.r = 0; this.s = 1; }
  set(x, y){ this.x = x; this.y = y; this.draw(); return this; }
  draw(){ const h = this.cells.length*C; this.g.setAttribute('transform', `translate(${this.x},${this.y}) rotate(${this.r} ${C/2} ${h/2}) scale(${this.s})`); }
  fly(x, y, dur=520, h=60){ const x0 = this.x, y0 = this.y; return tw(dur, p=>{ const e = ease(p); this.x = x0+(x-x0)*e; this.y = y0+(y-y0)*e - Math.sin(Math.PI*e)*h; this.draw(); }); }
  recolor(pal, dur=420){ const from = this.cells.map(c=>[c._f.getAttribute('fill'), c._s.getAttribute('fill')]);
    return tw(dur, p=>this.cells.forEach((c,i)=>{ c._f.setAttribute('fill', mix(from[i][0], pal[0], p)); c._s.setAttribute('fill', mix(from[i][1], pal[1], p)); })); }
}
function mix(a, b, p){ const A = parseInt(a.slice(1),16), B = parseInt(b.slice(1),16); const ch = s => Math.round(((A>>s)&255)*(1-p) + ((B>>s)&255)*p);
  return '#'+[16,8,0].map(s=>ch(s).toString(16).padStart(2,'0')).join(''); }
const raise = p => p.g.parentNode.appendChild(p.g);   // 맨 앞으로

/* 쟁반 · 접시 */
const TRAY = {x:40, y:16, w:660, h:170};
function drawTray(){
  el('rect', {x:TRAY.x+4, y:TRAY.y+8, width:TRAY.w, height:TRAY.h, rx:20, fill:'rgba(107,74,46,.13)'});
  el('rect', {x:TRAY.x, y:TRAY.y, width:TRAY.w, height:TRAY.h, rx:20, fill:'#DCAA70', stroke:INK, 'stroke-width':2.2});
  el('rect', {x:TRAY.x+12, y:TRAY.y+12, width:TRAY.w-24, height:TRAY.h-24, rx:12, fill:'#F0D5A9', stroke:'#C08A52', 'stroke-width':1.5});
  // 나뭇결 몇 줄
  for (const [y, x0, x1] of [[40,90,250],[70,320,560],[104,140,300],[132,380,640],[150,90,220]])
    el('path', {d:`M${x0} ${TRAY.y+y} q ${(x1-x0)/2} -5 ${x1-x0} 0`, fill:'none', stroke:'#DDB27C', 'stroke-width':1.6, 'stroke-linecap':'round'});
}
let plates = [];
function drawPlate(cx, cy, R){
  el('circle', {cx:cx+3, cy:cy+7, r:R, fill:'rgba(107,74,46,.14)'});
  el('circle', {cx, cy, r:R, fill:'#FFFFFF', stroke:INK, 'stroke-width':2.2});
  el('circle', {cx, cy, r:R-12, fill:'#F6EFE3', stroke:'#E2D2BA', 'stroke-width':1.5});
  for (let k=0;k<24;k++){ const a = k/24*Math.PI*2; el('circle', {cx:cx+Math.cos(a)*(R-6), cy:cy+Math.sin(a)*(R-6), r:1.6, fill:'#D9C7A8'}); }
}
function pill(x, y, txt, red){
  const g = el('g', {class:'plbl', opacity:0});
  const r = el('rect', {y:y-19, height:38, rx:19, fill:'#fff', stroke: red ? '#D9534F' : INK, 'stroke-width':2.4}, g);
  const t = el('text', {x, y:y+1, 'text-anchor':'middle', 'dominant-baseline':'central', fill: red ? '#C0392B' : '#2A2A3C'}, g);
  g.setText = s => { t.textContent = s; const w = Math.max(54, t.getComputedTextLength() + 26); r.setAttribute('x', x - w/2); r.setAttribute('width', w); g.setAttribute('opacity', 1); };
  return g;
}

/* ---------- 세로식 (오른쪽) ---------- */
const LD = { cx:{d:144, t:212, o:280}, y:{Q:74, D:142, S1:210, R1:278, S2:346, R2:414}, line1:244, line2:380 };
const ld = $('ld');
function ldReset(){
  ld.innerHTML = '';
  ['t','o'].forEach(c=>{ const b = document.createElement('div'); b.className = 'cband'; b.id = 'band'+c; css(b, {left:(LD.cx[c]-30)+'px', width:'60px', top:'42px', height:'406px'}); ld.appendChild(b); });
  let h = ''; for (let x=42; x<=460; x+=68) h += `<line x1="${x}" y1="0" x2="${x}" y2="565"/>`;
  for (let y=40; y<=565; y+=68) h += `<line x1="0" y1="${y}" x2="460" y2="${y}"/>`;
  ld.insertAdjacentHTML('beforeend', `<svg width="460" height="565" style="position:absolute;left:0;top:0"><g stroke="#EFE5D3" stroke-width="2">${h}</g>
    <path d="M178 108 Q198 142 178 176 M178 108 L330 108" fill="none" stroke="#2A2A3C" stroke-width="4" stroke-linecap="round"/>
    <path id="arrow" d="M304 162 C 328 196, 328 236, 304 262" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="6 6" opacity="0" style="transition:opacity .4s"/></svg>`);
  $('chk').style.opacity = 0;
}
function dg(col, row, txt, cls='k', anim=true){
  const d = document.createElement('div'); d.className = 'ldg '+cls+(anim?' pop':''); d.textContent = txt;
  css(d, {left:LD.cx[col]+'px', top:LD.y[row]+'px'}); ld.appendChild(d); if (anim) SFX.write(); return d;
}
function lline(y, x0, x1){ const l = document.createElement('div'); l.className = 'lline'; css(l, {left:x0+'px', top:(y-2)+'px', width:(x1-x0)+'px', transform:'scaleX(0)'}); ld.appendChild(l); requestAnimationFrame(()=>requestAnimationFrame(()=>l.style.transform='scaleX(1)')); }
function band(col, cls){ ['t','o'].forEach(c=>{ const b = $('band'+c); if (!b) return; if (c===col){ b.className = 'cband '+cls; b.style.opacity = 1; } else b.style.opacity = 0; }); }

/* ---------- 문제 ---------- */
const PROBS = [[52,4],[53,4],[75,3],[84,4]];
let GEN = 0;
function buildTabs(cur){
  const t = $('tabs'); t.innerHTML = '';
  PROBS.forEach(([a,d])=>{ const b = document.createElement('button'); b.textContent = `${a} ÷ ${d}`; if (a===cur[0] && d===cur[1]) b.className = 'on';
    b.onclick = ()=>{ unlock(); run(a, d); }; t.appendChild(b); });
}
// 쟁반 안 자리
const traySlotRod  = i => [TRAY.x + 34 + i*(C+9), TRAY.y + 20];
const traySlotCube = k => [TRAY.x + 330 + (k%14)*(C+6), TRAY.y + 30 + Math.floor(k/14)*(C+8)];

async function run(a, d){
  const g = ++GEN; tweens.clear(); sv.innerHTML = ''; buildTabs([a,d]); ldReset(); clearBtns();
  const alive = () => g === GEN;
  const T = Math.floor(a/10), O = a%10, q1 = Math.floor(T/d), r1 = T%d, ones = r1*10+O, q2 = Math.floor(ones/d), r2 = ones%d, q = q1*10+q2;

  drawTray();
  // 접시: 개수에 맞춰 크기·간격
  const sp = Math.min(240, 712/d), R = Math.min(108, sp/2 - 7), cy = 334;
  plates = []; const lbl = [];
  for (let i=0;i<d;i++){ const cx = 370 + (i-(d-1)/2)*sp; drawPlate(cx, cy, R); plates.push({cx, cy}); }
  for (let i=0;i<d;i++) lbl.push(pill(plates[i].cx, cy + R + 30, ''));
  const layer = el('g', {});
  const rods = [], cubes = [];
  for (let i=0;i<T;i++){ const [x,y] = traySlotRod(i); rods.push(new Piece(10, PAL.ten, layer).set(x, y)); }
  for (let k=0;k<O;k++){ const [x,y] = traySlotCube(k); cubes.push(new Piece(1, PAL.one, layer).set(x, y)); }
  const cnt = plates.map(()=>({t:0, o:0}));
  const setCnt = i => lbl[i].setText(String(cnt[i].t*10 + cnt[i].o));
  // 접시 위 자리: 십막대는 위에서부터 눕혀 쌓고, 낱개는 그 아래 줄
  // 접시 위: 십막대는 왼쪽에 나란히 눕히고, 낱개는 오른쪽에 세로로 7개씩
  const rodAt  = (i, r) => [plates[i].cx - 6 - (q1 - r)*(C+6), plates[i].cy - 5*C];
  const cubeAt = (i, r) => [plates[i].cx + 6 + Math.floor(r/7)*(C+4), plates[i].cy - 5*C + 6 + (r%7)*(C+4)];

  dg('d','D',String(d),'k',false); dg('t','D',String(T),'g',false); dg('o','D',String(O),'b',false);
  say(`<b>${a}</b>${jo(a,'을','를')} 접시 <b>${d}</b>개에 똑같이 나누어 볼까?<br><span style="font-size:20px;color:#8A6A4A">십막대 ${T}개와 낱개 ${O}개가 있어. 큰 것부터 나눠!</span>`);
  await buttons([{label:'시작 ▶', val:1}]); if (!alive()) return;

  /* ① 십막대 */
  band('t','g');
  say(`십막대 <b class=g>${T}개</b>를 접시 <b>${d}</b>개에 똑같이 나누면,<br>한 접시에 <b>몇 개씩</b> 줄 수 있을까?`);
  await ask([q1-1, q1, q1+1].filter(x=>x>=1), q1, v => v > q1 ? `${v}개씩이면 십막대가 ${v*d}개 필요해. ${T}개뿐이라 모자라!` : `${v}개씩 주고도 ${T - v*d}개가 남아. 한 바퀴 더 줄 수 있어!`, alive);
  if (!alive()) return;
  clearBtns(); say(`맞아! 한 개씩 차례로 나눠 줄게.`);
  let ri = 0;
  for (let r=0;r<q1;r++) for (let i=0;i<d;i++){
    const rod = rods[ri++]; raise(rod); const [x,y] = rodAt(i, r);
    SFX.tok(); await rod.fly(x, y, r===0 ? 560 : 420, 70); if (!alive()) return; cnt[i].t++; setCnt(i);
  }
  dg('t','Q',String(q1),'g'); await sleep(350);
  dg('t','S1',String(q1*d),'g'); await sleep(250); lline(LD.line1, 182, 244); await sleep(350);
  if (!alive()) return;
  const left = rods.slice(ri);
  if (r1){
    dg('t','R1',String(r1),'r'); await Promise.all(left.map(r=>r.recolor(PAL.red, 500)));
    say(`한 접시에 <b class=g>${q1}개</b>씩! 몫의 십의 자리는 <b class=g>${q1}</b>.<br>그런데 십막대 <b class=r>${r1}개</b>가 남았어. 이걸 어떻게 하지?`);
    const v = await buttons([{label:'낱개로 바꿔요', cls:'opt', val:'s'}, {label:'그냥 둬요', cls:'opt', val:'k'}]); if (!alive()) return;
    if (v==='k'){ say(`그대로 두면 똑같이 나누지 못한 게 너무 많아! 십막대 1개는 <b>낱개 10개</b>와 같으니까 바꿔서 나눠 보자.`); await buttons([{label:'바꿔 보기 ▶', val:1}]); if (!alive()) return; }
    clearBtns();
    /* ② 내림: 십막대 → 낱개 10개 */
    say(`<b class=r>십막대 ${r1}개 = 낱개 ${r1*10}개</b>! 탁, 풀어 볼게.`);
    let k0 = O;
    for (const rod of left){
      raise(rod); await rod.fly(TRAY.x + 250, TRAY.y + 20, 560, 30); if (!alive()) return;
      await tw(300, p=>{ rod.r = Math.sin(p*Math.PI*6)*4*(1-p); rod.draw(); }); SFX.crack();
      // 칸 사이가 벌어지며 낱개 10개로
      await tw(420, p=>rod.cells.forEach((c,k)=>c.setAttribute('transform', `translate(0,${k*C + (k-4.5)*4*ease(p)})`)));
      await rod.recolor(PAL.one, 380); if (!alive()) return;
      const pcs = rod.cells.map((c,k)=>{ const pc = new Piece(1, PAL.one, layer); pc.set(rod.x, rod.y + k*C + (k-4.5)*4); return pc; });
      rod.g.remove();
      await Promise.all(pcs.map((pc,k)=>sleep(k*45).then(()=>{ const [x,y] = traySlotCube(k0+k); return pc.fly(x, y, 520, 40); })));
      cubes.push(...pcs); k0 += 10;
    }
    if (!alive()) return;
  } else { say(`한 접시에 <b class=g>${q1}개</b>씩, 남은 십막대는 없어!`); await sleep(600); }
  $('arrow').style.opacity = 1; dg('o','R1',String(O),'b'); await sleep(450);
  band('o','b');
  say(`낱개가 모두 <b class=b>${ones}개</b>! 세로식에서는 <b class=b>${O}</b>${jo(O,'을','를')} 내려 써서 <b class=b>${ones}</b>.<br>낱개 ${ones}개를 접시 ${d}개에 똑같이 나누면 한 접시에 몇 개씩?`);
  /* ③ 낱개 */
  await ask([q2-1, q2, q2+1].filter(x=>x>=0), q2, v => v > q2 ? `${v}개씩이면 ${v*d}개가 필요해. ${ones}개뿐이야!` : `${v}개씩 주면 ${ones - v*d}개가 남아. 더 줄 수 있어!`, alive);
  if (!alive()) return;
  clearBtns(); say(`좋아! 이번에도 한 개씩 차례로.`);
  let ci = 0;
  for (let r=0;r<q2;r++) for (let i=0;i<d;i++){
    const c = cubes[ci++]; raise(c); const [x,y] = cubeAt(i, r);
    SFX.tok(); await c.fly(x, y, Math.max(240, 420 - (r*d+i)*18), 50); if (!alive()) return; cnt[i].o++; setCnt(i);
  }
  dg('o','Q',String(q2),'b'); await sleep(300);
  const p2 = q2*d; if (p2>=10) dg('t','S2',String(Math.floor(p2/10)),'b'); dg('o','S2',String(p2%10),'b'); await sleep(250);
  lline(LD.line2, 182, 312); await sleep(350);
  dg('o','R2',String(r2), r2 ? 'r' : 'k'); band(null);
  const rest = cubes.slice(ci);
  if (r2){
    await Promise.all(rest.map(c=>c.recolor(PAL.red, 450)));
    // 남은 것은 빈 쟁반 가운데로
    const LX = TRAY.x + 250;
    await Promise.all(rest.map((c,k)=>sleep(k*80).then(()=>c.fly(LX - C/2 + (k-(rest.length-1)/2)*(C+5), TRAY.y + 70, 520, 30))));
    pill(LX, TRAY.y + 120, '', true).setText(`남은 것 ${r2}`);
  }
  if (!alive()) return;
  SFX.ding();
  say(r2 ? `한 접시에 <b>${q}</b>개씩, <b class=r>${r2}개</b>가 남아. 남은 것이 접시 수 <b>${d}</b>보다 작으니 더는 못 나눠!<br><b>${a} ÷ ${d} = ${q} … ${r2}</b>`
         : `한 접시에 <b>${q}</b>개씩, 남는 것 없이 똑같이 나눴어!<br><b>${a} ÷ ${d} = ${q}</b>`);
  await buttons([{label:'맞는지 확인 ▶', val:1}]); if (!alive()) return; clearBtns();
  /* ④ 확인 */
  $('chk').innerHTML = r2 ? `확인: ${d} × ${q} + ${r2} = ${a}` : `확인: ${d} × ${q} = ${a}`; $('chk').style.opacity = 1; SFX.write();
  say(r2 ? `<b>${q}</b>개짜리 접시가 <b>${d}</b>개면 ${d*q}, 남은 <b class=r>${r2}</b>를 더하면 <b>${a}</b>! 처음 수와 같으니 맞았어.`
         : `<b>${q}</b>개짜리 접시가 <b>${d}</b>개면 <b>${d} × ${q} = ${a}</b>. 처음 수와 같으니 맞았어!`);
  await buttons([{label:'🔁 다시 보기', cls:'w', val:1}]); if (alive()) run(a, d);
}
async function ask(opts, ans, wrongMsg, alive){
  let tries = 0;
  while (alive()){
    const v = await buttons(opts.map(x=>({label:`${x}개`, cls:'opt', val:x})));
    if (!alive()) return;
    if (v === ans){ SFX.ding(); return; }
    tries++; say(wrongMsg(v) + (tries>=2 ? `<br>정답은 <b>${ans}개</b>야!` : ''));
    if (tries>=2){ await sleep(1400); return; }
  }
}
run(52, 4);
</script>
